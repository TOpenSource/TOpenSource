name: NEXUS Publish Article

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Markdown filename"
        required: true
        type: string
      title:
        description: "Article title"
        required: true
        type: string
      description:
        description: "Article description"
        required: false
        type: string
      tags:
        description: "Tags, separated by commas"
        required: false
        type: string
      content:
        description: "Markdown content"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create article
        env:
          ARTICLE_FILENAME: ${{ inputs.filename }}
          ARTICLE_TITLE: ${{ inputs.title }}
          ARTICLE_DESCRIPTION: ${{ inputs.description }}
          ARTICLE_TAGS: ${{ inputs.tags }}
          ARTICLE_CONTENT: ${{ inputs.content }}
        run: |
          set -e

          mkdir -p src/content/posts

          FILE="src/content/posts/${ARTICLE_FILENAME}.md"

          {
            echo "---"
            echo "title: \"${ARTICLE_TITLE//\"/\\\"}\""
            echo "description: \"${ARTICLE_DESCRIPTION//\"/\\\"}\""
            echo "pubDate: $(date -u +%Y-%m-%d)"
            echo "tags:"
            
            IFS=',' read -ra TAG_ARRAY <<< "$ARTICLE_TAGS"

            for tag in "${TAG_ARRAY[@]}"; do
              tag="$(echo "$tag" | xargs)"
              [ -n "$tag" ] && echo "  - \"$tag\""
            done

            echo "---"
            echo
            printf '%s\n' "$ARTICLE_CONTENT"
          } > "$FILE"

          echo "Created: $FILE"

      - name: Commit article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/content/posts/

          git commit -m "Publish article: ${{ inputs.title }}" || {
            echo "Nothing to commit"
            exit 0
          }

          git push
