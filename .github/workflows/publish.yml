name: NEXUS Article Manager

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nexus-article-manager
  cancel-in-progress: false

jobs:
  manage:
    if: >
      github.event.issue.user.login == 'TOpenSource' &&
      (
        startsWith(github.event.issue.title, '[NEXUS PUBLISH]') ||
        startsWith(github.event.issue.title, '[NEXUS EDIT]') ||
        startsWith(github.event.issue.title, '[NEXUS DELETE]')
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Parse and modify article
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")

          print("Issue:", title)

          # ----------------------------------------
          # Detect operation
          # ----------------------------------------

          if title.startswith("[NEXUS PUBLISH]"):
              action = "publish"

          elif title.startswith("[NEXUS EDIT]"):
              action = "edit"

          elif title.startswith("[NEXUS DELETE]"):
              action = "delete"

          else:
              raise SystemExit("Unsupported NEXUS operation")

          print("Operation:", action)

          # ----------------------------------------
          # Safe filename
          # ----------------------------------------

          def safe_filename(value):
              value = value.strip()

              if not value:
                  raise SystemExit("Missing filename")

              if "/" in value or "\\" in value:
                  raise SystemExit("Invalid filename")

              if ".." in value:
                  raise SystemExit("Invalid filename")

              if not re.fullmatch(
                  r"[A-Za-z0-9_-]+(?:\.md)?",
                  value
              ):
                  raise SystemExit(
                      "Filename may only contain letters, numbers, _ and -"
                  )

              value = re.sub(
                  r"\.md$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              if not value:
                  raise SystemExit("Invalid filename")

              return value + ".md"

          # ----------------------------------------
          # Read metadata
          # ----------------------------------------

          def get_value(meta, name):
              match = re.search(
                  rf"^NEXUS_{name}=(.*)$",
                  meta,
                  re.MULTILINE
              )

              if match:
                  return match.group(1).strip()

              return ""

          # ----------------------------------------
          # DELETE
          # ----------------------------------------

          if action == "delete":

              match = re.search(
                  r"<!-- NEXUS_DELETE_START -->(.*?)<!-- NEXUS_DELETE_END -->",
                  body,
                  re.S
              )

              if not match:
                  raise SystemExit(
                      "Invalid NEXUS delete payload"
                  )

              meta = match.group(1).strip()

              filename = get_value(
                  meta,
                  "FILENAME"
              )

              filename = safe_filename(
                  filename
              )

              path = (
                  Path("src/content/posts")
                  / filename
              )

              print("Delete target:", path)

              if not path.exists():
                  raise SystemExit(
                      f"Article does not exist: {path}"
                  )

              path.unlink()

              print(
                  f"Deleted: {path}"
              )

          # ----------------------------------------
          # PUBLISH / EDIT
          # ----------------------------------------

          else:

              meta_match = re.search(
                  r"<!-- NEXUS_(?:PUBLISH|EDIT)_START -->(.*?)<!-- NEXUS_(?:PUBLISH|EDIT)_END -->",
                  body,
                  re.S
              )

              content_match = re.search(
                  r"<!-- NEXUS_CONTENT_START -->(.*?)<!-- NEXUS_CONTENT_END -->",
                  body,
                  re.S
              )

              if not meta_match:
                  raise SystemExit(
                      "Invalid NEXUS metadata payload"
                  )

              if not content_match:
                  raise SystemExit(
                      "Missing article content"
                  )

              meta = meta_match.group(1).strip()

              content = (
                  content_match
                  .group(1)
                  .strip()
              )

              filename = get_value(
                  meta,
                  "FILENAME"
              )

              old_filename = get_value(
                  meta,
                  "OLD_FILENAME"
              )

              article_title = get_value(
                  meta,
                  "TITLE"
              )

              description = get_value(
                  meta,
                  "DESCRIPTION"
              )

              tags = get_value(
                  meta,
                  "TAGS"
              )

              if not article_title:
                  raise SystemExit(
                      "Missing title"
                  )

              if not content:
                  raise SystemExit(
                      "Empty article content"
                  )

              filename = safe_filename(
                  filename
              )

              target = (
                  Path("src/content/posts")
                  / filename
              )

              # ----------------------------------------
              # EDIT
              # ----------------------------------------

              if action == "edit":

                  if old_filename:
                      old_filename = safe_filename(
                          old_filename
                      )
                  else:
                      old_filename = filename

                  old_path = (
                      Path("src/content/posts")
                      / old_filename
                  )

                  print(
                      "Edit source:",
                      old_path
                  )

                  print(
                      "Edit target:",
                      target
                  )

                  if not old_path.exists():
                      raise SystemExit(
                          f"Article does not exist: {old_path}"
                      )

                  # Preserve original publication date
                  existing = old_path.read_text(
                      encoding="utf-8"
                  )

                  date_match = re.search(
                      r"^pubDate:\s*(.+)$",
                      existing,
                      re.MULTILINE
                  )

                  if date_match:
                      pub_date = (
                          date_match
                          .group(1)
                          .strip()
                      )
                  else:
                      pub_date = (
                          datetime.now(
                              timezone.utc
                          ).strftime(
                              "%Y-%m-%d"
                          )
                      )

                  # Prevent accidental overwrite
                  # when filename is changed
                  if target != old_path and target.exists():
                      raise SystemExit(
                          f"Target article already exists: {target}"
                      )

                  if target != old_path:
                      old_path.unlink()

              # ----------------------------------------
              # PUBLISH
              # ----------------------------------------

              else:

                  pub_date = (
                      datetime.now(
                          timezone.utc
                      ).strftime(
                          "%Y-%m-%d"
                      )
                  )

                  if target.exists():
                      raise SystemExit(
                          f"Article already exists: {target}"
                      )

              # ----------------------------------------
              # YAML escaping
              # ----------------------------------------

              def yaml_string(value):
                  value = value.replace(
                      "\\",
                      "\\\\"
                  )

                  value = value.replace(
                      '"',
                      '\\"'
                  )

                  value = value.replace(
                      "\r",
                      " "
                  )

                  value = value.replace(
                      "\n",
                      " "
                  )

                  return value

              article_title = yaml_string(
                  article_title
              )

              description = yaml_string(
                  description
              )

              tag_list = [
                  item.strip()
                  for item in tags.split(",")
                  if item.strip()
              ]

              # ----------------------------------------
              # Generate Markdown
              # ----------------------------------------

              output = []

              output.append("---")

              output.append(
                  f'title: "{article_title}"'
              )

              output.append(
                  f'description: "{description}"'
              )

              output.append(
                  f"pubDate: {pub_date}"
              )

              output.append(
                  "tags:"
              )

              for tag in tag_list:

                  tag = yaml_string(
                      tag
                  )

                  output.append(
                      f'  - "{tag}"'
                  )

              output.append("---")
              output.append("")
              output.append(content)
              output.append("")

              target.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              target.write_text(
                  "\n".join(output),
                  encoding="utf-8"
              )

              print(
                  f"Created/updated: {target}"
              )

          PY

      - name: Build verification
        run: |
          set -e

          npm ci

          npm run build

      - name: Commit changes
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/content/posts/

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          if [[ "$ISSUE_TITLE" == "[NEXUS PUBLISH]"* ]]; then
            COMMIT_MESSAGE="Publish article from NEXUS Admin"

          elif [[ "$ISSUE_TITLE" == "[NEXUS EDIT]"* ]]; then
            COMMIT_MESSAGE="Update article from NEXUS Admin"

          elif [[ "$ISSUE_TITLE" == "[NEXUS DELETE]"* ]]; then
            COMMIT_MESSAGE="Delete article from NEXUS Admin"

          else
            COMMIT_MESSAGE="NEXUS article management"
          fi

          git commit \
            -m "$COMMIT_MESSAGE"

          git push origin main

        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "NEXUS operation completed successfully. GitHub Pages deployment has been triggered."
