name: NEXUS Article Manager

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nexus-article-manager
  cancel-in-progress: false

jobs:
  auth:
    if: >
      github.event.issue.user.login == 'TOpenSource' &&
      startsWith(github.event.issue.title, '[NEXUS AUTH]')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Verify GitHub account
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          echo "================================="
          echo " NEXUS AUTH VERIFICATION"
          echo "================================="

          echo "GitHub account: ${{ github.event.issue.user.login }}"

          slug="$(
            printf '%s\n' "$ISSUE_BODY" |
            sed -n 's/^NEXUS_EDIT_SLUG=//p' |
            head -n 1 |
            tr -d '\r'
          )"

          if [ -z "$slug" ]; then
            echo "ERROR: Missing NEXUS_EDIT_SLUG"
            exit 1
          fi

          if ! printf '%s' "$slug" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "ERROR: Invalid article slug"
            exit 1
          fi

          edit_url="https://TOpenSource.github.io/admin/?edit=${slug}"

          echo "Verified account successfully."
          echo "Article slug: $slug"
          echo "Edit URL: $edit_url"

          gh issue comment "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"             --body "## NEXUS AUTH

          ✅ **GitHub account verified**

          Verified account: \`TOpenSource\`

          ### Continue editing

          [✎ CONTINUE EDITING]($edit_url)

          After verification, the article editor will open automatically with the selected article."

          gh issue close "$ISSUE_NUMBER"             --repo "$GITHUB_REPOSITORY"

  manage:
    if: >
      github.event.issue.user.login == 'TOpenSource' &&
      (
        startsWith(github.event.issue.title, '[NEXUS PUBLISH]') ||
        startsWith(github.event.issue.title, '[NEXUS EDIT]') ||
        startsWith(github.event.issue.title, '[NEXUS DELETE]')
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Parse and modify article
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")

          print("Issue:", title)

          if title.startswith("[NEXUS PUBLISH]"):
              action = "publish"
          elif title.startswith("[NEXUS EDIT]"):
              action = "edit"
          elif title.startswith("[NEXUS DELETE]"):
              action = "delete"
          else:
              raise SystemExit("Unsupported NEXUS operation")

          print("Operation:", action)

          def safe_filename(value):
              value = value.strip()

              if not value:
                  raise SystemExit("Missing filename")

              if "/" in value or "\\" in value:
                  raise SystemExit("Invalid filename")

              if ".." in value:
                  raise SystemExit("Invalid filename")

              value = re.sub(
                  r"\.md$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              # 只保留安全英文文件名
              if re.fullmatch(
                  r"[A-Za-z0-9_-]+",
                  value
              ):
                  return value + ".md"

              # 中文/其他字符无法直接作为安全文件名时，
              # 根据标题生成稳定的 ASCII 文件名
              ascii_value = value.encode(
                  "ascii",
                  "ignore"
              ).decode("ascii")

              ascii_value = re.sub(
                  r"[^A-Za-z0-9_-]+",
                  "-",
                  ascii_value
              ).strip("-_")

              if not ascii_value:
                  raise SystemExit(
                      "Invalid filename: please use an English filename or a title that can generate a slug"
                  )

              return ascii_value + ".md"

          def get_value(meta, name):
              match = re.search(
                  rf"^NEXUS_{name}=(.*)$",
                  meta,
                  re.MULTILINE
              )

              if match:
                  return match.group(1).strip()

              return ""

          if action == "delete":

              match = re.search(
                  r"<!-- NEXUS_DELETE_START -->(.*?)<!-- NEXUS_DELETE_END -->",
                  body,
                  re.S
              )

              if not match:
                  raise SystemExit("Invalid NEXUS delete payload")

              meta = match.group(1).strip()

              filename = safe_filename(
                  get_value(meta, "FILENAME")
              )

              path = Path("src/content/posts") / filename

              print("Delete target:", path)

              if not path.exists():
                  raise SystemExit(
                      f"Article does not exist: {path}"
                  )

              path.unlink()

              print("Deleted:", path)

          else:

              meta_match = re.search(
                  r"<!-- NEXUS_(?:PUBLISH|EDIT)_START -->(.*?)<!-- NEXUS_(?:PUBLISH|EDIT)_END -->",
                  body,
                  re.S
              )

              content_match = re.search(
                  r"<!-- NEXUS_CONTENT_START -->(.*?)<!-- NEXUS_CONTENT_END -->",
                  body,
                  re.S
              )

              if not meta_match:
                  raise SystemExit("Invalid NEXUS metadata payload")

              if not content_match:
                  raise SystemExit("Missing article content")

              meta = meta_match.group(1).strip()
              content = content_match.group(1).strip()

              filename = get_value(meta, "FILENAME")
              old_filename = get_value(meta, "OLD_FILENAME")
              article_title = get_value(meta, "TITLE")
              description = get_value(meta, "DESCRIPTION")
              tags = get_value(meta, "TAGS")
              category = get_value(meta, "CATEGORY") or "未分类"

              nexus_pubdate = get_value(meta, "PUBDATE")
              if not article_title:
                  raise SystemExit("Missing title")

              if not content:
                  raise SystemExit("Empty article content")

              filename = safe_filename(filename)

              target = Path("src/content/posts") / filename

              # PUBLISH 自动处理重复文件名
              if action == "publish":
                  original_stem = target.stem
                  suffix = 1

                  while target.exists():
                      suffix += 1
                      target = Path("src/content/posts") / f"{original_stem}-{suffix}.md"

                  filename = target.name

              if action == "edit":

                  if old_filename:
                      old_filename = safe_filename(old_filename)
                  else:
                      old_filename = filename

                  old_path = Path("src/content/posts") / old_filename

                  print("Edit source:", old_path)
                  print("Edit target:", target)

                  if not old_path.exists():
                      raise SystemExit(
                          f"Article does not exist: {old_path}"
                      )

                  existing = old_path.read_text(
                      encoding="utf-8"
                  )

                  date_match = re.search(
                      r"^pubDate:\s*(.+)$",
                      existing,
                      re.MULTILINE
                  )

                  if date_match:
                      pub_date = date_match.group(1).strip()
                  else:
                      pub_date = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

                  if target != old_path and target.exists():
                      raise SystemExit(
                          f"Target article already exists: {target}"
                      )

                  if target != old_path:
                      old_path.unlink()

              else:
                  if nexus_pubdate:
                      pub_date = nexus_pubdate
                  else:
                      pub_date = datetime.now(
                          timezone.utc
                      ).strftime("%Y-%m-%dT%H:%M:%SZ")

                  if target.exists():
                      raise SystemExit(
                          f"Article already exists: {target}"
                      )

              def yaml_string(value):
                  value = value.replace("\\", "\\\\")
                  value = value.replace('"', '\\"')
                  value = value.replace("\r", " ")
                  value = value.replace("\n", " ")
                  return value

              article_title = yaml_string(article_title)
              description = yaml_string(description)

              tag_list = [
                  item.strip()
                  for item in tags.split(",")
                  if item.strip()
              ]

              output = []

              output.append("---")
              output.append(
                  f'title: "{article_title}"'
              )
              output.append(
                  f'description: "{description}"'
              )
              output.append(
                  f"pubDate: {pub_date}"
              )

              output.append(
                  f'category: "{yaml_string(category)}"'
              )

              if tag_list:
                  output.append("tags:")
                  for tag in tag_list:
                      output.append(
                          f'  - "{yaml_string(tag)}"'
                      )
              else:
                  output.append("tags: []")

              output.append("---")
              output.append("")
              output.append(content)
              output.append("")

              target.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              target.write_text(
                  "\n".join(output),
                  encoding="utf-8"
              )

              print("Created/updated:", target)

          PY

      - name: Build verification
        run: |
          set -e

          npm ci
          npm run build

      - name: Commit changes
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/content/posts/

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          case "$ISSUE_TITLE" in
            "[NEXUS PUBLISH]"*)
              COMMIT_MESSAGE="Publish article from NEXUS Admin"
              ;;
            "[NEXUS EDIT]"*)
              COMMIT_MESSAGE="Update article from NEXUS Admin"
              ;;
            "[NEXUS DELETE]"*)
              COMMIT_MESSAGE="Delete article from NEXUS Admin"
              ;;
            *)
              COMMIT_MESSAGE="NEXUS article management"
              ;;
          esac

          git commit -m "$COMMIT_MESSAGE"

          # 同步远程 main，避免 NEXUS 与其他 GitHub Actions
          # 同时更新时出现 fetch first
          git fetch origin main
          git rebase origin/main

          git push origin main

      - name: Delete issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue delete "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --yes
