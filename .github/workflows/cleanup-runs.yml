name: Cleanup Workflow Runs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Keep latest 5 runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          for WORKFLOW in \
            "NEXUS Article Manager" \
            "Deploy Astro to GitHub Pages"
          do
            echo "Cleaning: $WORKFLOW"

            IDS=$(gh run list \
              --repo "$REPO" \
              --workflow="$WORKFLOW" \
              --limit 100 \
              --json databaseId,status \
              --jq '.[] | select(.status == "completed") | .databaseId' \
              | tail -n +6)

            for ID in $IDS; do
              echo "Deleting run: $ID"
              gh run delete "$ID" --repo "$REPO" || true
            done
          done
